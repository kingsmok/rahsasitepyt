# ============================================================
# Nginx — کانفیگ سرور اصلی آکادمی آنلاین (SSL + Gzip + Cache)
# مسیر نصب: /etc/nginx/sites-available/academy
#   sudo ln -s /etc/nginx/sites-available/academy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ── HTTP → HTTPS (ریدایرکت همیشگی) ──
server {
    listen 80;
    listen [::]:80;
    server_name academy.example.com www.academy.example.com;

    # افزایش سایز آپلود (هماهنگ با MAX_CONTENT_LENGTH=50MB در Flask)
    client_max_body_size 55m;

    # ریدایرکت به HTTPS
    return 301 https://$host$request_uri;
}

# ── HTTPS اصلی ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name academy.example.com www.academy.example.com;

    # ── SSL (گواهی Let's Encrypt) ──
    ssl_certificate     /etc/letsencrypt/live/academy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security Headers (لایه دوم — لایه اول در Flask/CSP) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml font/woff2;

    # ── لاگ‌ها ──
    access_log /var/log/nginx/academy.access.log;
    error_log  /var/log/nginx/academy.error.log;

    # ── فایل‌های استاتیک (کش ۷ روزه + immutable) ──
    location /static/ {
        alias /var/www/academy/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── فایل کلید IndexNow برای Bing (ریشه سایت) ──
    location ~ ^/[0-9a-fA-F]{32}\.txt$ {
        root /var/www/academy;
        access_log off;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # ── robots.txt / favicon (کش کوتاه) — sitemap.xml پویا است و از Flask سرو می‌شود ──
    location = /robots.txt  { root /var/www/academy; access_log off; expires 1d; }
    location = /favicon.ico { root /var/www/academy/static/img; access_log off; expires 7d; }

    # ── همه چیز دیگر → Gunicorn (پروکسی) ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # WebSocket (چت آنلاین)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
