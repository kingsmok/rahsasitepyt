{% extends 'admin/base.html' %}
{% block atitle %}تمرین جدید{% endblock %}
{% block acontent %}
<div class="dash-head"><div><h1>📌 تمرین جدید</h1></div><a class="btn btn-ghost" href="{{ url_for('admin.assignments') }}">← تمرین‌ها</a></div>
<div class="card" style="padding:24px;max-width:640px">
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
      <label>عنوان تمرین *</label>
      <input class="form-control" name="title" required placeholder="مثلاً: ساخت اولین پروژه پایتون">
    </div>
    <div class="form-group">
      <label>دوره *</label>
      <select class="form-control" name="course_id" required>
        {% for c in courses %}
        <option value="{{ c.id }}">{{ c.title }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>توضیحات تمرین</label>
      <textarea class="form-control" name="description" rows="4" placeholder="چه چیزی از دانشجو خواسته می‌شود؟"></textarea>
    </div>
    <div class="form-group">
      <label>حداکثر نمره</label>
      <input class="form-control" type="number" name="max_score" value="100">
    </div>
    <button class="btn btn-primary" type="submit">💾 ذخیره</button>
  </form>
</div>
{% endblock %}
