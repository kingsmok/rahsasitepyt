{% extends 'admin/base.html' %}
{% block atitle %}{{ 'ویرایش مطلب' if post else 'مطلب جدید' }}{% endblock %}
{% block acontent %}
<div class="dash-head">
  <div><h1>{{ '✏️ ویرایش مطلب' if post else '➕ مطلب جدید' }}</h1></div>
  <a class="btn btn-ghost" href="{{ url_for('admin.blog') }}">← وبلاگ</a>
</div>
<form method="post" class="card" style="padding:26px;max-width:860px">
<input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
  <div class="form-group"><label for="f_title_1">عنوان</label><input id="f_title_1" class="form-control" name="title" value="{{ post.title if post else '' }}" required></div>
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px">
    <div class="form-group"><label for="f_category_1">دسته</label><input id="f_category_1" class="form-control" name="category" value="{{ post.category if post else 'آموزش' }}"></div>
    <div class="form-group"><label for="f_image_1">تصویر</label>
      <select id="f_image_1" class="form-control" name="image">
        {% for img in images %}<option value="{{ img }}" {{ 'selected' if post and post.image == img }}>{{ img }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <div class="form-group"><label for="f_excerpt_1">خلاصه</label><textarea id="f_excerpt_1" class="form-control" name="excerpt" style="min-height:70px">{{ post.excerpt if post else '' }}</textarea></div>
  <div class="form-group"><label for="f_body_1">متن کامل</label><textarea id="f_body_1" class="form-control" name="body" style="min-height:240px">{{ post.body if post else '' }}</textarea></div>
  <label class="form-check mb-3"><input type="checkbox" name="published" {{ 'checked' if not post or post.published }}> منتشر شود</label>
  <button class="btn btn-primary btn-lg" type="submit">💾 ذخیره</button>
</form>
{% endblock %}
