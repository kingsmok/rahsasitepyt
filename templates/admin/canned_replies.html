{% extends 'admin/base.html' %}
{% block atitle %}پاسخ‌های آماده{% endblock %}
{% block acontent %}
<div class="dash-head"><div><h1>💬 پاسخ‌های آماده تیکت</h1><p>پاسخ‌های پرتکرار برای سرعت پشتیبانی</p></div></div>
<div class="grid" style="grid-template-columns:1fr 1fr;gap:18px;align-items:start">
  <div class="card" style="padding:22px">
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
      <div class="form-group"><label>عنوان</label><input class="form-control" name="title" required placeholder="مثلاً: نحوه دریافت گواهی"></div>
      <div class="form-group"><label>متن پاسخ</label><textarea class="form-control" name="body" rows="4" required placeholder="متن آماده پاسخ..."></textarea></div>
      <button class="btn btn-primary" type="submit">💾 ذخیره</button>
    </form>
  </div>
  <div class="card" style="padding:22px">
    <h2 style="font-size:14px;margin-bottom:12px">پاسخ‌های موجود</h2>
    {% for r in items %}
    <div style="padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong style="font-size:13px">{{ r.title }}</strong>
        <form method="post" action="{{ url_for('admin.canned_reply_delete', rid=r.id) }}">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
          <button class="btn btn-danger btn-sm">🗑</button>
        </form>
      </div>
      <p class="text-2" style="font-size:12.5px;margin-top:4px">{{ r.body[:150] }}</p>
    </div>
    {% else %}
    <p class="text-3" style="font-size:13px">پاسخی ذخیره نشده است.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
