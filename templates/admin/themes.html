{% extends 'admin/base.html' %}
{% block atitle %}تم‌های سایت{% endblock %}
{% block acontent %}
<div class="dash-head">
  <div><h1>🎨 تم‌های سایت</h1><p>۲۰ طراحی آماده — کاربران می‌توانند از دکمه 🎨 در سایت بین آن‌ها جابه‌جا شوند</p></div>
</div>
<form method="post">
<input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px">
    {% for t in themes %}
    <label class="theme-opt {{ 'active' if current == t.id }}" style="cursor:pointer">
      <div class="preview" style="background:{{ 'linear-gradient(135deg,#0d1526,#1c2838)' if t.dark else 'linear-gradient(135deg,#f4f6fb,#ffffff)' }}">
        {% for c in t.colors %}<i style="background:{{ c }}"></i>{% endfor %}
        <i style="background:#ffffff33;border:1px solid rgba(255,255,255,.2);flex:1"></i>
      </div>
      <div class="t-name">{{ t.name }}</div>
      <div class="t-desc">{{ t.desc }}</div>
      <div style="margin-top:8px">
        <input type="radio" name="theme" value="{{ t.id }}" class="hide" {{ 'checked' if current == t.id }}>
        {% if current == t.id %}<span class="badge badge-success">✓ تم فعلی</span>{% else %}<span class="badge badge-gray">انتخاب</span>{% endif %}
      </div>
    </label>
    {% endfor %}
  </div>
  <div class="text-center mt-4">
    <button class="btn btn-primary btn-lg" type="submit">💾 ذخیره تم پیش‌فرض</button>
  </div>
</form>
{% endblock %}
