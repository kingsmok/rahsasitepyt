{% extends 'admin/base.html' %}
{% block atitle %}افزودن کاربر{% endblock %}
{% block acontent %}
<div class="dash-head"><div><h1>➕ افزودن دستی کاربر</h1><p>ثبت‌نام توسط منشی/ادمین</p></div></div>
<div class="card" style="padding:24px;max-width:560px">
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <div class="form-group"><label>نام و نام خانوادگی *</label><input class="form-control" name="name" required></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label>موبایل</label><input class="form-control" name="phone" dir="ltr" placeholder="09..."></div>
      <div class="form-group"><label>ایمیل *</label><input class="form-control" name="email" type="email" dir="ltr" required></div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label>رمز عبور *</label><input class="form-control" name="password" type="password" minlength="8" required></div>
      <div class="form-group"><label>نقش</label>
        <select class="form-control" name="role">
          <option value="student">دانشجو</option>
          {% if cur_user.role in ('admin', 'super_admin') %}
          <option value="teacher">استاد</option>
          <option value="secretary">منشی</option><option value="support">پشتیبان</option>
          <option value="operator">اپراتور</option>
          {% endif %}
          {% if cur_user.role == 'super_admin' %}
          <option value="admin">ادمین</option><option value="super_admin">سوپر ادمین</option>
          {% endif %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>تصویر پروفایل / آواتار</label>
      <div class="flex gap-1" style="align-items:center">
        <img id="user-avatar-preview" src="" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--border);display:none">
        <input class="form-control" type="file" name="avatar_file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" style="flex:1">
      </div>
      <input type="hidden" id="user-avatar-input" name="avatar" value="">
      <button type="button" class="mm-btn-lib" style="margin-top:8px"
              onclick="MediaLibrary.open({target:'user-avatar-input', preview:'user-avatar-preview', filter:'image'})">
        📁 انتخاب از کتابخانه رسانه
      </button>
    </div>
    <button class="btn btn-primary btn-lg" type="submit">💾 ساخت کاربر</button>
  </form>
</div>
{% endblock %}
