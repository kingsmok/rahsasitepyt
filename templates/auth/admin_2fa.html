{% extends 'base.html' %}
{% block title %}تایید دومرحله‌ای — پنل مدیریت{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:440px">
    <div class="auth-card">
      <div class="text-center mb-3"><div style="font-size:44px">🔐</div>
        <h1 style="font-size:20px;margin-top:10px">تایید دومرحله‌ای</h1>
        <p class="text-2" style="font-size:13px">برای امنیت بیشتر، کد ۶ رقمی ارسال‌شده به موبایل {{ cur_user.phone if cur_user.phone else 'شما' }} را وارد کنید.</p>
      </div>
      <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
          <label for="a2fa">کد تایید</label>
          <input id="a2fa" class="form-control" name="code" dir="ltr" maxlength="6" required autofocus placeholder="123456" style="text-align:center;font-size:20px;letter-spacing:6px">
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">✅ تایید و ورود به پنل</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
