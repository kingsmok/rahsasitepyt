{% extends 'base.html' %}
{% block title %}{{ seo.title or "بازیابی رمز عبور — آکادمی آنلاین" }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="max-width:460px">
    <div class="auth-card">
      <div class="text-center mb-3"><div style="font-size:44px">🔑</div>
        <h1 style="font-size:20px;margin-top:10px">بازیابی رمز عبور</h1>
        <p class="text-2" style="font-size:13px">شماره موبایل ثبت‌شده خود را وارد کنید تا کد بازیابی برایتان ارسال شود.</p>
      </div>
      <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
          <label for="fg_phone">شماره موبایل</label>
          <input id="fg_phone" class="form-control" type="text" name="phone" placeholder="09xxxxxxxxx" dir="ltr" pattern="09[0-9]{9}" required autofocus>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">📲 دریافت کد بازیابی</button>
        <div class="text-center mt-2">
          <a class="text-2" style="font-size:12.5px" href="{{ url_for('auth.forgot_email') }}">📧 بازیابی با ایمیل</a>
          &nbsp;|&nbsp;
          <a class="text-2" style="font-size:12.5px" href="{{ url_for('auth.login') }}">← بازگشت به ورود</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
