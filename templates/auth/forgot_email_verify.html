{% extends 'base.html' %}
{% block title %}{{ seo.title or "تأیید کد بازیابی — آکادمی آنلاین" }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="max-width:460px">
    <div class="auth-card">
      <div class="text-center mb-3">
        <div style="font-size:44px">🔑</div>
        <h1 style="font-size:20px;margin-top:10px">تأیید و تغییر رمز عبور</h1>
        <p class="text-2" style="font-size:13px">کد ارسال‌شده به <b dir="ltr">{{ email }}</b> را وارد کنید و رمز جدید بسازید.</p>
      </div>
      <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
          <label for="fg_code">کد تأیید (۵ رقمی)</label>
          <input id="fg_code" class="form-control" type="text" name="code" 
                 dir="ltr" inputmode="numeric" pattern="[0-9]{5}" 
                 maxlength="5" autocomplete="one-time-code" required autofocus
                 placeholder="•••••">
        </div>
        <div class="form-group">
          <label for="fg_pass">رمز جدید</label>
          <input id="fg_pass" class="form-control" type="password" name="password" 
                 placeholder="حداقل ۸ کاراکتر" minlength="8" 
                 autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="fg_confirm">تکرار رمز جدید</label>
          <input id="fg_confirm" class="form-control" type="password" name="confirm" 
                 minlength="8" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">✅ تغییر رمز عبور</button>
        <div class="d-flex justify-content-between mt-3" style="font-size:12.5px">
          <a class="text-2" href="{{ url_for('auth.forgot_email') }}">📧 ارسال مجدد کد</a>
          <a class="text-2" href="{{ url_for('auth.login') }}">← بازگشت به ورود</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
