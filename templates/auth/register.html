{% extends 'base.html' %}
{% block title %}{{ seo.title or "ثبت‌نام" }}{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card" style="max-width:520px">
    <a class="a-logo" href="{{ url_for('site.index') }}"><span class="ic">🎓</span>{{ site.site_name or 'آکادمی آنلاین' }}</a>
    <h1>ساخت حساب کاربری</h1>
    <p class="a-sub">ثبت‌نام رایگان — کد ملی و شماره تماس <b class="text-danger">الزامی</b> است</p>

    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label for="f_name_1">نام و نام خانوادگی <span class="req">*</span></label>
        <input id="f_name_1" class="form-control" name="name" placeholder="مثلا: علی محمدی" required autofocus>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label for="f_phone_1">شماره موبایل <span class="req">*</span></label>
          <input id="f_phone_1" class="form-control" name="phone" placeholder="09xxxxxxxxx" dir="ltr" autocomplete="tel"
                 pattern="09[0-9]{9}" required title="شماره موبایل ۱۱ رقمی">
        </div>
        <div class="form-group">
          <label for="f_national_code_1">کد ملی <span class="req">*</span></label>
          <input id="f_national_code_1" class="form-control" name="national_code" placeholder="۱۰ رقم" dir="ltr" autocomplete="off"
                 pattern="[0-9]{10}" maxlength="10" required title="کد ملی ۱۰ رقمی">
        </div>
      </div>
      <div class="form-group">
        <label for="f_email_1">ایمیل <span class="req">*</span></label>
        <input id="f_email_1" class="form-control" type="email" name="email" placeholder="you@example.com" dir="ltr" required>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label for="f_password_1">رمز عبور <span class="req">*</span></label>
          <input id="f_password_1" class="form-control" type="password" name="password" placeholder="حداقل ۶ کاراکتر" required>
        </div>
        <div class="form-group">
          <label for="f_confirm_1">تکرار رمز عبور <span class="req">*</span></label>
          <input id="f_confirm_1" class="form-control" type="password" name="confirm" placeholder="تکرار رمز" required>
        </div>
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">ایجاد حساب 🚀</button>
    </form>

    <p class="a-alt">قبلا ثبت‌نام کرده‌اید؟ <a href="{{ url_for('auth.login') }}">وارد شوید</a></p>
  </div>
</div>
{% endblock %}
