{% extends 'base.html' %}
{% block title %}{{ seo.title or "تماس با ما" }}{% endblock %}
{% block content %}
<section class="section" style="padding:0">
  <div style="background:var(--hero-bg);color:#fff;padding:64px 0;text-align:center;position:relative;overflow:hidden">
    <div style="position:absolute;inset:0;background:url('/static/img/pattern-girih.svg');background-size:150px;opacity:.07"></div>
    <div style="position:relative">
      <div style="font-size:44px">📬</div>
      <h1 style="font-size:clamp(26px,4vw,36px);font-weight:900;margin:12px 0 8px">تماس با ما</h1>
      <p style="color:rgba(255,255,255,.85);font-size:14.5px">تیم پشتیبانی آکادمی آماده پاسخگویی به شماست</p>
    </div>
  </div>
  <div class="container" style="max-width:960px;margin-top:-38px;position:relative;z-index:5">
    <div class="card" style="padding:34px;box-shadow:var(--shadow-lg)">
      <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px">
        <div style="text-align:center;padding:14px;background:var(--bg-2);border-radius:14px"><div style="font-size:22px">📞</div><small class="text-2" style="font-size:12px;display:block;margin-top:4px">{{ fa(site.phone) }}</small></div>
        <div style="text-align:center;padding:14px;background:var(--bg-2);border-radius:14px"><div style="font-size:22px">✉️</div><small class="text-2" style="font-size:12px;display:block;margin-top:4px" dir="ltr">{{ site.email }}</small></div>
        <div style="text-align:center;padding:14px;background:var(--bg-2);border-radius:14px"><div style="font-size:22px">📍</div><small class="text-2" style="font-size:12px;display:block;margin-top:4px">{{ site.address }}</small></div>
      </div>
      <h3 style="font-size:17px;margin-bottom:18px;text-align:center">📨 فرم تماس</h3>
      <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

        <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px">
          <div class="form-group"><label for="f_name_1">نام <span class="req">*</span></label><input id="f_name_1" class="form-control" name="name" required></div>
          <div class="form-group"><label for="f_email_1">ایمیل</label><input id="f_email_1" class="form-control" type="email" name="email" dir="ltr"></div>
        </div>
        <div class="form-group"><label for="f_subject_1">موضوع</label>
          <select id="f_subject_1" class="form-control" name="subject"><option>سوال درباره دوره‌ها</option><option>همکاری با آکادمی</option><option>پیشنهاد و انتقاد</option><option>مشکل در پرداخت</option><option>سایر</option></select>
        </div>
        <div class="form-group"><label for="f_message_1">پیام <span class="req">*</span></label><textarea id="f_message_1" class="form-control" name="message" style="min-height:120px" required></textarea></div>
        {{ captcha_box() }}
          <button class="btn btn-primary btn-lg btn-block" type="submit">ارسال پیام ✈️</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
